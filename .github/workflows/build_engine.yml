name: Build Stripped iGodot 4.7

on:
  push:
    paths:
      - 'custom.py'
      - '.github/workflows/build_engine.yml'
  workflow_dispatch:
    inputs:
      godot_branch:
        description: 'Godot Branch or Tag'
        required: true
        default: '4.7-stable'

permissions:
  contents: write

jobs:
  build-ios:
    name: iGodot iOS Engine & Template
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python & SCons
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install scons

      - name: Clone Godot Source
        run: |
          BRANCH="${{ inputs.godot_branch || '4.7-stable' }}"
          git clone --depth 1 --branch "$BRANCH" https://github.com/godotengine/godot.git || \
          git clone --depth 1 https://github.com/godotengine/godot.git
          cp custom.py godot/custom.py

      - name: Compile Stripped iOS arm64 Library
        working-directory: godot
        run: |
          scons platform=ios target=template_release arch=arm64 profile=custom.py generate_bundle=yes -j$(sysctl -n hw.ncpu)

      - name: Package iGodot iOS Template
        run: |
          mkdir -p artifacts
          cd godot/bin
          zip -r ../../artifacts/igodot_ios_release.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: artifacts/igodot_ios_release.zip

  build-windows:
    name: iGodot Windows x86_64 Template
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python & SCons
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install scons

      - name: Clone Godot Source
        run: |
          $branch = "${{ inputs.godot_branch }}"
          if ([string]::IsNullOrEmpty($branch)) { $branch = "4.7-stable" }
          git clone --depth 1 --branch $branch https://github.com/godotengine/godot.git ; if ($LASTEXITCODE -ne 0) { git clone --depth 1 https://github.com/godotengine/godot.git }
          Copy-Item custom.py godot/custom.py

      - name: Compile Stripped Windows Template
        working-directory: godot
        run: |
          scons platform=windows target=template_release arch=x86_64 profile=custom.py d3d12=no accesskit=no -j4
          Get-ChildItem bin/*.exe | Select-Object -First 1 | Move-Item -Destination bin/igodot_windows_release_x86_64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: godot/bin/igodot_windows_release_x86_64.exe

  build-android:
    name: iGodot Android arm64 Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 & SCons
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: pip install scons

      - name: Configure Pre-Installed Android SDK & NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018" "build-tools;35.0.0" "platforms;android-35"

      - name: Clone Godot Source
        run: |
          BRANCH="${{ inputs.godot_branch || '4.7-stable' }}"
          git clone --depth 1 --branch "$BRANCH" https://github.com/godotengine/godot.git || \
          git clone --depth 1 https://github.com/godotengine/godot.git
          cp custom.py godot/custom.py

      - name: Compile Stripped Android APK Template
        working-directory: godot
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          python misc/scripts/install_swappy_android.py
          scons platform=android target=template_release arch=arm64 profile=custom.py generate_apk=yes -j$(nproc)
          if [ ! -f bin/android_release.apk ]; then
            cd platform/android/java
            ./gradlew generateGodotTemplates
            cd ../../..
          fi
          mv bin/android_release.apk bin/igodot_android_release_arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: godot/bin/igodot_android_release_arm64.apk

  publish-release:
    name: Publish iGodot Engine & Templates
    needs: [build-ios, build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release_files
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.7-igodot
          name: "iGodot 4.7 Stripped Engine & Export Templates"
          files: release_files/*
          
  patch-swiftpm-62:
    name: Create Swift 6.2 Playground Package Branch
    runs-on: ubuntu-latest
    steps:
      - name: Clone & Downgrade Tools Version to 6.2
        run: |
          git clone --branch binary https://github.com/migueldeicaza/SwiftGodotKit.git sg_kit
          cd sg_kit
          sed -i 's/swift-tools-version: 6.3/swift-tools-version: 6.2/g' Package.swift
          git config user.name "iGodot Builder"
          git config user.email "builder@igodot.local"
          git commit -am "Support iPad Swift Playgrounds 6.2" || true
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/swift-6.2
