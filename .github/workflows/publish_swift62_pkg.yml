name: Publish Swift 6.2 Compatible SwiftGodotKit Tag

on:
  push:
    paths:
      - '.github/workflows/publish_swift62_pkg.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-swift62-tag:
    runs-on: macos-15
    steps:
      - name: Merge SwiftGodotKit + SwiftGodotBinary for Swift 6.2
        run: |
          git clone --depth 1 --branch binary https://github.com/migueldeicaza/SwiftGodotKit.git sg_kit || \
          git clone --depth 1 https://github.com/migueldeicaza/SwiftGodotKit.git sg_kit
          git clone --depth 1 https://github.com/migueldeicaza/SwiftGodotBinary.git sg_bin

          python3 - << 'EOF'
          import re

          with open("sg_kit/Package.swift", "r") as f:
              kit = f.read()
          with open("sg_bin/Package.swift", "r") as f:
              bin_pkg = f.read()

          def extract_binary_targets(text):
              targets = []
              idx = 0
              while True:
                  start = text.find(".binaryTarget(", idx)
                  if start == -1:
                      break
                  depth = 0
                  for i in range(start, len(text)):
                      if text[i] == "(":
                          depth += 1
                      elif text[i] == ")":
                          depth -= 1
                          if depth == 0:
                              targets.append(text[start:i+1])
                              idx = i + 1
                              break
                  else:
                      break
              return targets

          bin_targets = extract_binary_targets(bin_pkg)
          # Skip any binaryTarget whose name already exists in SwiftGodotKit
          filtered_targets = []
          for bt in bin_targets:
              m = re.search(r'name\s*:\s*"([^"]+)"', bt)
              if m and f'name: "{m.group(1)}"' in kit:
                  continue
              filtered_targets.append(bt)

          # 1. Downgrade swift-tools-version to 5.9
          kit = re.sub(r"//\s*swift-tools-version:.*", "// swift-tools-version: 5.9", kit, count=1)

          # 2. Remove remote SwiftGodot / SwiftGodotBinary package dependencies
          kit = re.sub(r'\.package\s*\([^)]*SwiftGodot[^)]*\)\s*,?', '', kit)

          # 3. Point SwiftGodotKit's target dependency to the merged local binaryTarget
          kit = re.sub(r'\.product\s*\(\s*name:\s*"SwiftGodot"\s*,\s*package:\s*"[^"]+"\s*\)', '"SwiftGodot"', kit)

          # 4. Inject into the LAST `targets: [` (package targets, NOT products targets)
          matches = list(re.finditer(r'targets\s*:\s*\[', kit))
          if matches and filtered_targets:
              last_match = matches[-1]
              insert_pos = last_match.end()
              injected = "\n        " + ",\n        ".join(filtered_targets) + ","
              kit = kit[:insert_pos] + injected + kit[insert_pos:]

          with open("sg_kit/Package.swift", "w") as f:
              f.write(kit)
          EOF

          cd sg_kit
          cat Package.swift
          swift package dump-package > /dev/null
          git config user.name "iGodot Builder"
          git config user.email "builder@igodot.local"
          git add Package.swift
          git commit -m "Fix targets injection for Swift 6.2 Playgrounds" || true
          git tag -f 6.2.1
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" refs/tags/6.2.1
