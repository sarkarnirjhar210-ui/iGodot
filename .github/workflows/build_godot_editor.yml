name: Build Native Godot Editor IPA (iOS)

on:
  workflow_dispatch:
    inputs:
      godot_version:
        description: 'Godot Git tag (e.g. 4.7.2-stable or 4.8-stable)'
        required: true
        default: '4.7.2-stable'

permissions:
  contents: write

jobs:
  build-godot-editor:
    runs-on: macos-26
    steps:
      - name: Checkout iGodot Patches
        uses: actions/checkout@v5
        with:
          path: igodot

      - name: Select Latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Using $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"

      - name: Install Build Tools (SCons + ccache + XcodeGen)
        run: brew install scons ccache xcodegen

      - name: Cache ccache (Speeds Up Future Rebuilds)
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: godot-ios-editor-${{ inputs.godot_version || '4.7.2-stable' }}-${{ github.run_id }}
          restore-keys: |
            godot-ios-editor-${{ inputs.godot_version || '4.7.2-stable' }}-

      - name: Clone Official Godot Source
        run: |
          TAG="${{ inputs.godot_version || '4.7.2-stable' }}"
          git clone --depth 1 --branch "$TAG" https://github.com/godotengine/godot.git godot

      - name: Apply iOS Editor Patches
        working-directory: godot
        run: |
          python3 ../igodot/patches/day1_ios_editor.py
          python3 ../igodot/patches/day2_ios_editor_fix.py
          python3 ../igodot/patches/day3_touch_viewport.py

      - name: Compile Godot Editor Static Library (iOS arm64 + Metal)
        working-directory: godot
        env:
          PATH: /opt/homebrew/opt/ccache/libexec:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
          CCACHE_MAXSIZE: 4G
        run: |
          scons platform=ios target=editor arch=arm64 \
            metal=yes vulkan=no \
            optimize=speed debug_symbols=no \
            -j$(sysctl -n hw.ncpu)
          ls -lh bin/

      - name: Build Unsigned GodotEditor.app via XcodeGen
        working-directory: godot
        run: |
          mkdir -p build_ios/src
          LIB_PATH=$(ls bin/libgodot.ios*.a | head -n 1)
          echo "Linking static library: $LIB_PATH"
          cp "$LIB_PATH" build_ios/libgodot.a

          cat << 'EOF' > build_ios/src/dummy.mm
          void godot_apple_embedded_plugins_initialize() {}
          void godot_apple_embedded_plugins_deinitialize() {}
          EOF

          cat << 'EOF' > build_ios/src/dummy.swift
          import Foundation
          EOF

          cat << 'EOF' > build_ios/project.yml
          name: GodotEditor
          options:
            bundleIdPrefix: com.igodot
            deploymentTarget:
              iOS: "17.0"
          targets:
            GodotEditor:
              type: application
              platform: iOS
              sources:
                - path: src
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.igodot.nativeeditor
                  MARKETING_VERSION: "4.7.2"
                  CURRENT_PROJECT_VERSION: "1"
                  TARGETED_DEVICE_FAMILY: "1,2"
                  SWIFT_VERSION: "5.0"
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_UIFileSharingEnabled: YES
                  INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
                  OTHER_LDFLAGS:
                    - "-ObjC"
                    - "-force_load"
                    - "$(PROJECT_DIR)/libgodot.a"
                    - "-lc++"
                    - "-lz"
              dependencies:
                - sdk: Foundation.framework
                - sdk: UIKit.framework
                - sdk: Metal.framework
                - sdk: MetalKit.framework
                - sdk: QuartzCore.framework
                - sdk: CoreGraphics.framework
                - sdk: CoreMotion.framework
                - sdk: AudioToolbox.framework
                - sdk: AVFoundation.framework
                - sdk: CoreAudio.framework
                - sdk: GameController.framework
                - sdk: CoreHaptics.framework
                - sdk: CoreMedia.framework
                - sdk: Security.framework
                - sdk: SystemConfiguration.framework
                - sdk: WebKit.framework
                - sdk: StoreKit.framework
                - sdk: OpenGLES.framework
          EOF

          cd build_ios
          xcodegen generate
          xcodebuild \
            -project GodotEditor.xcodeproj \
            -scheme GodotEditor \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package & Verify GodotEditor.ipa
        working-directory: godot
        run: |
          rm -rf Payload GodotEditor.ipa
          mkdir -p Payload
          ditto build_ios/derived/Build/Products/Release-iphoneos/GodotEditor.app Payload/GodotEditor.app
          zip -qry GodotEditor.ipa Payload
          zip -T GodotEditor.ipa

      - name: Publish GodotEditor.ipa to GitHub Releases
        working-directory: igodot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="editor-${{ inputs.godot_version || '4.7.2-stable' }}"
          gh release delete "$TAG" -y || true
          git push origin ":refs/tags/$TAG" || true
          gh release create "$TAG" ../godot/GodotEditor.ipa \
            --title "iGodot Native Editor (${{ inputs.godot_version || '4.7.2-stable' }})" \
            --notes "Unsigned native Godot C++ target=editor IPA for LiveContainer."
